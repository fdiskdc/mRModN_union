<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mRModN RNA Visualization</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #mRModN-boot-loader { min-height: 100vh; display: grid; place-items: center; color: #5267d8; background: linear-gradient(145deg, #f7f8fc 0%, #eef1ff 100%); }
      #mRModN-boot-loader > div { display: grid; justify-items: center; gap: 14px; }
      #mRModN-boot-loader i { width: 34px; height: 34px; border: 4px solid rgba(82,103,216,.18); border-top-color: #5267d8; border-radius: 50%; animation: mRModN-spin .8s linear infinite; }
      #mRModN-boot-loader strong { font-size: 15px; }
      #mRModN-boot-loader span { color: #7b8394; font-size: 13px; }
      @keyframes mRModN-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Polyfill GPUShaderStage for browsers without WebGPU support -->
    <!-- three-render-objects imports three/webgpu at module top-level,
         which references GPUShaderStage.VERTEX/FRAGMENT/COMPUTE.
         Without this polyfill, non-WebGPU browsers crash on load. -->
    <script>
      if (typeof GPUShaderStage === 'undefined') {
        window.GPUShaderStage = { VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 };
      }
    </script>
  </head>
  <body>
    <div id="root"><div id="mRModN-boot-loader"><div><i></i><strong>正在加载 mRModN 交互式 3D…</strong><span>首次打开需要加载渲染资源</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
