services:
  backend:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        UV_VERSION: ${UV_VERSION:-0.11.28}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: rgcn_backend
    command: gunicorn -w ${GUNICORN_WORKERS:-1} -b 0.0.0.0:8000 --timeout 120 wsgi:app
    ports:
      - "${BACKEND_PORT:-9005}:8000"
    volumes:
      - .:/app
      - ${DATA_DIR:-./data}:/app/data
      - ${REID_DATA_ROOT:-../SYSU-MM01}:/reid/SYSU-MM01:ro
      - ${REID_OUTPUT_DIR:-../outputs}:/reid/outputs:ro
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - WX_APPID=${WX_APPID:-}
      - WX_SECRET=${WX_SECRET:-}
      - REDIS_HOST=redis
      - REID_DATA_ROOT=/reid/SYSU-MM01
      - REID_CHECKPOINT_PATH=/reid/outputs/best.pt
      - REID_DEVICE=cpu
      - REID_TORCH_NUM_THREADS=${REID_TORCH_NUM_THREADS:-4}
      - REID_CACHE_SIZE=${REID_CACHE_SIZE:-8}
    restart: always
    depends_on:
      - redis

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
        UV_VERSION: ${UV_VERSION:-0.11.28}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: rgcn_worker
    command: celery -A tasks_docker.celery_app worker --concurrency=${CELERY_CONCURRENCY:-1} --loglevel=info
    volumes:
      - .:/app
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - REDIS_HOST=redis
      - WX_APPID=${WX_APPID:-}
      - WX_SECRET=${WX_SECRET:-}
    restart: always
    depends_on:
      - redis
      - backend

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:alpine}
    container_name: rgcn_redis
    restart: always
