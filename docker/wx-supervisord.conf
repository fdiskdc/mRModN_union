[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir /tmp --save "" --appendonly no --protected-mode yes
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/app
command=/bin/sh -c 'exec celery -A tasks.celery_app worker --concurrency="${CELERY_CONCURRENCY:-1}" --loglevel=info --without-gossip --without-mingle'
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/app
command=/bin/sh -c 'exec gunicorn -w "${GUNICORN_WORKERS:-1}" -b 0.0.0.0:8000 --timeout 3600 --access-logfile - --error-logfile - wsgi:app'
priority=30
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
