server {
    # Public frontend port. The browser uses same-origin /mrmodn/api requests,
    # which are forwarded to the backend port inside this container.
    listen 9006 default_server;
    listen [::]:9006 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Production frontend API prefix. Remove only the /mrmodn deployment
    # prefix and preserve /api/v1/... for Flask.
    location /mrmodn/api/ {
        rewrite ^/mrmodn(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keep backend endpoints available through the frontend origin as well, so
    # browser clients do not need to know the server IP or cross CORS origins.
    location /api/ {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
